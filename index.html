<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="[https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5520140239122283](https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5520140239122283)" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theglenndrasmusic | Official Global Music Community</title>
    
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css](https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css)" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
        }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen font-sans text-white pb-20">

    <nav class="p-6 flex justify-between items-center border-b border-gray-700">
        <div class="text-2xl font-bold tracking-tighter">THE GLENNDRAS</div>
        <div class="space-x-6 hidden md:block">
            <a href="#" class="hover:text-red-500 transition">Music</a>
            <a href="#" class="hover:text-red-500 transition">Community</a>
            <a href="#" class="hover:text-red-500 transition">Insights</a>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-12 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-4">Official Global Music Community</h1>
        <p class="text-gray-400 mb-8 max-w-2xl mx-auto">Connecting musicians and fans through the power of AI and melody.</p>
        
        <div id="fan-chat-container" class="bg-gray-800/50 p-6 rounded-xl border border-gray-700 max-w-lg mx-auto">
            <h3 class="text-xl font-semibold mb-4">GlennBot Fan Chat</h3>
            <div id="chat-messages" class="h-40 overflow-y-auto mb-4 text-left text-sm space-y-2 p-2 bg-black/30 rounded">
                <p class="text-green-400">GlennBot: Halo! Gue udah balik online nih. Mau dengerin lagu apa hari ini?</p>
            </div>
            <div class="flex gap-2">
                <input type="text" placeholder="Tanya GlennBot..." class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm">
                <button class="bg-red-600 px-4 py-2 rounded text-sm font-bold">Kirim</button>
            </div>
        </div>
    </main>

    <!-- AD CONTAINER BOTTOM -->
    <div id="ad-container-bottom" style="position:fixed; bottom:0; left:0; width:100%; z-index:9999; background: rgba(0,0,0,0.8); text-align:center; padding: 5px 0;">
        <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Sponsored Content</p>
        <ins class="adsbygoogle"
             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-pub-[5520140239122283](5520140239122283)"
             data-ad-slot="[1115213689](1115213689)"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        console.log("GlennBot System Initializing...");
        const chatInput = document.querySelector('input[type="text"]');
        const sendBtn = document.querySelector('button');
        const chatBox = document.getElementById('chat-messages');

        sendBtn.addEventListener('click', () => {
            if(chatInput.value.trim() !== "") {
                const userMsg = document.createElement('p');
                userMsg.innerHTML = `<span class="text-blue-400">You:</span> ${chatInput.value}`;
                chatBox.appendChild(userMsg);
                
                setTimeout(() => {
                    const botMsg = document.createElement('p');
                    botMsg.innerHTML = `<span class="text-green-400">GlennBot:</span> Keren banget inputnya! Gue lagi pelajarin itu buat update lagu berikutnya.`;
                    chatBox.appendChild(botMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);
                
                chatInput.value = "";
            }
        });
    </script>
</body>
</html>
