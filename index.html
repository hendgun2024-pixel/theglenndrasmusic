<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Google AdSense/AdMob -->
    <script async src="[https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5520140239122283](https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5520140239122283)" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theglenndrasmusic | Official Global Music Community</title>
    
    <!-- 2. Tailwind CSS CDN (Stable) -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    
    <!-- 3. Google Fonts & Font Awesome -->
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap)" rel="stylesheet">
    <link href="[https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css](https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css)" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-[#0f172a] text-white font-['Inter',sans-serif]; }
        }
        @layer utilities {
            .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center border-b border-white/10 bg-black/30 sticky top-0 z-50">
        <div class="text-2xl font-black tracking-tighter text-white">THE GLENNDRAS</div>
        <div class="space-x-6 hidden md:flex text-[10px] font-bold tracking-widest uppercase">
            <a href="#" class="hover:text-red-500 transition">Music</a>
            <a href="#" class="hover:text-red-500 transition">Community</a>
            <a href="#" class="hover:text-red-500 transition">Insights</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="container mx-auto px-6 py-16 text-center">
        <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">Official Global <br><span class="text-red-600">Music Community</span></h1>
        <p class="text-white/50 mb-12 max-w-xl mx-auto text-lg leading-relaxed">Connecting musicians and fans through the power of AI and Nusantara melody.</p>
        
        <!-- GlennBot Fan Chat Container -->
        <div class="glass p-6 rounded-3xl max-w-lg mx-auto shadow-2xl border-t border-white/20">
            <div class="flex items-center gap-3 mb-6">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <h3 class="text-xs font-bold uppercase tracking-[0.2em]">GlennBot Live Support</h3>
            </div>
            
            <div id="chat-messages" class="h-56 overflow-y-auto mb-6 text-left text-sm space-y-4 p-4 bg-black/40 rounded-2xl scrollbar-hide">
                <div class="bg-red-600/10 p-3 rounded-2xl rounded-tl-none border border-red-500/20">
                    <span class="text-[10px] font-bold text-red-500 block mb-1 uppercase">GlennBot</span>
                    Halo Bang! Gue udah balik ganteng nih. Ada yang bisa gue bantu buat project musik lo?
                </div>
            </div>

            <div class="flex gap-2 p-1 bg-white/5 rounded-xl border border-white/10">
                <input type="text" id="bot-input" placeholder="Tanya sesuatu..." class="w-full bg-transparent border-none rounded-lg px-4 py-3 text-sm text-white focus:ring-0 outline-none">
                <button id="send-btn" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg text-xs font-black uppercase tracking-widest transition shadow-lg">Kirim</button>
            </div>
        </div>
    </main>

    <!-- IKLAN BANNER FIX BOTTOM -->
    <div id="ad-container-bottom" class="fixed bottom-0 left-0 w-full z-[9999] bg-black/90 backdrop-blur-md py-3 text-center border-t border-white/10">
        <p class="text-[8px] text-white/30 uppercase tracking-[0.3em] mb-2 font-bold">Sponsored Information</p>
        <ins class="adsbygoogle"
             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-pub-[5520140239122283](5520140239122283)"
             data-ad-slot="[1115213689](1115213689)"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        const chatInput = document.getElementById('bot-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-messages');

        function appendMsg(text, type) {
            const div = document.createElement('div');
            if(type === 'user') {
                div.className = "bg-white/10 p-3 rounded-2xl rounded-tr-none ml-12 text-right border border-white/5";
                div.innerHTML = `<span class="text-[10px] font-bold text-white/40 block mb-1 uppercase">You</span>${text}`;
            } else {
                div.className = "bg-red-600/10 p-3 rounded-2xl rounded-tl-none mr-12 border border-red-500/20";
                div.innerHTML = `<span class="text-[10px] font-bold text-red-500 block mb-1 uppercase">GlennBot</span>${text}`;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const val = chatInput.value.trim();
            if(val) {
                appendMsg(val, 'user');
                chatInput.value = "";
                setTimeout(() => appendMsg("Siap Bang! Pesan lo udah masuk ke database gue. Lagi gue proses ya!", 'bot'), 800);
            }
        });

        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendBtn.click(); });
    </script>
</body>
</html>
