<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google AdSense -->
    <script async src="[https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5520140239122283](https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5520140239122283)" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theglenndrasmusic | Official Global Music Community</title>
    
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css](https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css)" rel="stylesheet">
    
    <style>
        /* CSS Manual biar nggak buta kalau Tailwind gagal load */
        body {
            background-color: #0f172a !important; /* Biru sangat gelap */
            color: #ffffff !important; /* WAJIB PUTIH */
            margin: 0;
            font-family: sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #ad-container-bottom {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center border-b border-white/10 bg-black/20">
        <div class="text-2xl font-black tracking-tighter text-white">THE GLENNDRAS</div>
        <div class="space-x-6 hidden md:flex text-sm font-medium">
            <a href="#" class="text-white/70 hover:text-white transition">MUSIC</a>
            <a href="#" class="text-white/70 hover:text-white transition">COMMUNITY</a>
            <a href="#" class="text-white/70 hover:text-white transition">INSIGHTS</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="container mx-auto px-6 py-20 text-center">
        <h1 class="text-4xl md:text-6xl font-black mb-6 text-white leading-tight">Official Global <br><span class="text-red-500">Music Community</span></h1>
        <p class="text-white/60 mb-10 max-w-xl mx-auto text-lg">Connecting musicians and fans through the power of AI and Nusantara melody.</p>
        
        <!-- Chat Box -->
        <div class="glass-card p-6 rounded-2xl max-w-lg mx-auto shadow-2xl">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <h3 class="text-sm font-bold uppercase tracking-widest text-white">GlennBot Fan Chat</h3>
            </div>
            <div id="chat-messages" class="h-48 overflow-y-auto mb-4 text-left text-sm space-y-3 p-4 bg-black/40 rounded-xl scrollbar-hide">
                <p class="text-green-400 font-medium">GlennBot: Halo Bang! Gue udah standby lagi. Ada ide lagu baru atau mau cek promo musik hari ini?</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="bot-input" placeholder="Tanya GlennBot..." class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 transition">
                <button id="send-btn" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg text-sm font-bold text-white transition shadow-lg shadow-red-900/20">Kirim</button>
            </div>
        </div>
    </main>

    <!-- IKLAN BANNER -->
    <div id="ad-container-bottom" class="fixed bottom-0 left-0 w-full z-[9999] py-2 text-center">
        <p class="text-[9px] text-white/30 uppercase tracking-[0.2em] mb-1">Sponsored</p>
        <ins class="adsbygoogle"
             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-pub-[5520140239122283](5520140239122283)"
             data-ad-slot="[1115213689](1115213689)"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        const chatInput = document.getElementById('bot-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-messages');

        function sendMessage() {
            const val = chatInput.value.trim();
            if(val !== "") {
                const userMsg = document.createElement('div');
                userMsg.className = "bg-white/10 p-3 rounded-lg ml-8 text-right text-white/90";
                userMsg.innerHTML = `<span class="text-[10px] block text-white/40 mb-1">YOU</span>${val}`;
                chatBox.appendChild(userMsg);
                
                chatInput.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;

                setTimeout(() => {
                    const botMsg = document.createElement('div');
                    botMsg.className = "bg-red-900/20 p-3 rounded-lg mr-8 border border-red-500/20 text-white/90";
                    botMsg.innerHTML = `<span class="text-[10px] block text-red-400 mb-1 font-bold">GLENNBOT</span>Mantap Bang! Gue proses dulu ya ide lo. Lagi gue racik biar makin viral! 🚀`;
                    chatBox.appendChild(botMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
